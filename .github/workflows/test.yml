name: Test suite

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Test (${{matrix.elixir}}/${{matrix.otp}})
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      matrix:
        include:
          - { elixir: '1.12', otp: '24', os: 'ubuntu-24.04' }
          - { elixir: '1.13', otp: '24', os: 'ubuntu-24.04' }
          - { elixir: '1.13', otp: '25', os: 'ubuntu-24.04' }
          - { elixir: '1.14', otp: '24', os: 'ubuntu-24.04' }
          - { elixir: '1.14', otp: '25', os: 'ubuntu-24.04' }
          - { elixir: '1.14', otp: '26' }
          - { elixir: '1.15', otp: '24', os: 'ubuntu-24.04' }
          - { elixir: '1.15', otp: '25', os: 'ubuntu-24.04' }
          - { elixir: '1.15', otp: '26' }
          - { elixir: '1.16', otp: '24', os: 'ubuntu-24.04' }
          - { elixir: '1.16', otp: '25', os: 'ubuntu-24.04' }
          - { elixir: '1.16', otp: '26' }
          - { elixir: '1.17', otp: '25', os: 'ubuntu-24.04' }
          - { elixir: '1.17', otp: '26' }
          - { elixir: '1.17', otp: '27' }
          - { elixir: '1.18', otp: '25', os: 'ubuntu-24.04' }
          - { elixir: '1.18', otp: '26' }
          - { elixir: '1.18', otp: '27' }
          - { elixir: '1.18', otp: '28' }
          - { elixir: '1.19', otp: '26' }
          - { elixir: '1.19', otp: '27' }
          - { elixir: '1.19', otp: '28' }
          - { elixir: '1.20', otp: '27' }
          - { elixir: '1.20', otp: '28' }
          - { elixir: '1.20', otp: '29', check_format: true }
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install Dependencies
        run: mix deps.get

      - name: Check format
        if: matrix.check_format
        run: mix format --check-formatted

      - name: Run Tests
        run: mix test
